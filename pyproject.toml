[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "obsidian-postit-kde"
version = "0.2.5"
description = "KDE tray app to quickly save notes and clipboard into an Obsidian vault"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "sleroy" }]
keywords = ["obsidian", "kde", "tray", "notes", "postit", "markdown"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "PySide6>=6.6",
    "keyring>=24",
    "httpx>=0.27",
    "trafilatura>=1.8",
    "markdownify>=0.11",
]

[project.optional-dependencies]
mcp = ["mcp>=2"]
web = ["markdownify>=0.11"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2",
]

[project.scripts]
obsidian-postit-kde = "obsidian_postit_kde.__main__:main"

[project.urls]
Homepage = "https://github.com/sleroy/obsidian-postit-kde"
Repository = "https://github.com/sleroy/obsidian-postit-kde"
Issues = "https://github.com/sleroy/obsidian-postit-kde/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/obsidian_postit_kde"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
packages = ["obsidian_postit_kde"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
