<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef9c3"/>
      <stop offset="1" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eab308"/>
      <stop offset="1" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- sticky paper, slightly rotated, with a folded bottom-right corner -->
  <g filter="url(#shadow)" transform="rotate(-4 64 64)">
    <path d="M26 20 h76 v62 l-20 20 h-56 z" fill="url(#paper)"/>
    <!-- folded corner -->
    <path d="M102 82 l-20 20 v-20 z" fill="url(#fold)"/>
    <!-- note text lines -->
    <g stroke="#9a7b0a" stroke-width="5" stroke-linecap="round" opacity="0.65">
      <line x1="38" y1="44" x2="90" y2="44"/>
      <line x1="38" y1="58" x2="90" y2="58"/>
      <line x1="38" y1="72" x2="74" y2="72"/>
    </g>
  </g>

  <!-- push pin -->
  <g transform="translate(64 20)">
    <ellipse cx="0" cy="18" rx="3.5" ry="2.5" fill="#4c1d95" opacity="0.4"/>
    <rect x="-1.5" y="2" width="3" height="16" rx="1.5" fill="#7c3aed"/>
    <circle cx="0" cy="2" r="9" fill="url(#pin)"/>
    <circle cx="-3" cy="-1" r="3" fill="#ffffff" opacity="0.55"/>
  </g>
</svg>
